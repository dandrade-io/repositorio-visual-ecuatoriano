<div class="flex flex-col space-y-1">
  <input-label for="" label="{{ label() }}" />
  <input
    class="text-[15px] text-[#1C1917] px-2 py-1 border border-[#E7E1D8] rounded-[5px] font-light"
    type="text"
    [value]="value()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (blur)="onTouched()"
  />
</div>
