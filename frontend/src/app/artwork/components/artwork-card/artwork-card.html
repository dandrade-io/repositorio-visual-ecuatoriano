<li class="group">
  <div class="relative aspect-square overflow-hidden rounded-xl border border-black/10 bg-gray-50">
    <img
      [src]="imageUrl()"
      [alt]="artwork().title ?? 'Portada de álbum'"
      loading="lazy"
      class="h-full w-full object-cover transition-transform duration-300 hover:scale-105"
    />

    @if (artwork().score) {
      <span
        class="absolute right-2 top-2 rounded-full bg-black/50 px-2 py-0.5 text-[11px] font-medium tabular-nums text-white backdrop-blur-sm"
        title="Similitud"
      >
        {{ artwork().score | number: '1.3-3' }}
      </span>
    }
  </div>

  <div class="mt-2 px-0.5">
    <h3 class="truncate text-base font-normal text-gray-900">
      {{ artwork().title ?? 'Sin título' }}
    </h3>

    @if (artwork().artist || artwork().year) {
      <p class="truncate text-sm font-light text-gray-500">
        {{ artwork().artist }}
        @if (artwork().artist && artwork().year) {
          <span aria-hidden="true"> · </span>
        }
        {{ artwork().year }}
      </p>
    }
  </div>
</li>
