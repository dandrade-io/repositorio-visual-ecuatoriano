<div
  class="flex h-full w-full flex-col items-center justify-between bg-gradient-to-br from-gray-100 to-gray-200 p-4"
  (click)="$event.stopPropagation()"
>
  <div class="flex flex-1 items-center justify-center">
    <div
      class="grid h-20 w-20 place-items-center rounded-full bg-white shadow-sm ring-1 ring-black/5"
      [class.animate-pulse]="playing()"
    >
      <svg class="h-9 w-9 text-gray-700" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" />
      </svg>
    </div>
  </div>

  <div class="w-full space-y-1.5">
    <input
      type="range"
      min="0"
      max="100"
      step="0.1"
      [value]="progress()"
      (input)="seek($event)"
      aria-label="Progreso del audio"
      class="h-1 w-full cursor-pointer appearance-none rounded-full bg-gray-300 accent-gray-900"
      [style.background]="
        'linear-gradient(to right, #111827 ' + progress() + '%, #d1d5db ' + progress() + '%)'
      "
    />

    <div class="flex items-center justify-between">
      <button
        type="button"
        (click)="togglePlay($event)"
        [attr.aria-label]="playing() ? 'Pausar' : 'Reproducir'"
        class="grid h-9 w-9 place-items-center rounded-full bg-gray-900 text-white transition hover:bg-gray-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2"
      >
        @if (playing()) {
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
          </svg>
        } @else {
          <svg class="h-4 w-4 translate-x-px" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z" />
          </svg>
        }
      </button>

      <span class="text-xs font-medium tabular-nums text-gray-600">
        {{ formatTime(currentTime()) }} / {{ formatTime(duration()) }}
      </span>
    </div>
  </div>

  <audio
    #audioEl
    preload="metadata"
    [src]="src()"
    (play)="onPlay()"
    (pause)="onPause()"
    (ended)="onEnded()"
    (timeupdate)="currentTime.set(audioEl.currentTime)"
    (loadedmetadata)="duration.set(audioEl.duration)"
  ></audio>
</div>
