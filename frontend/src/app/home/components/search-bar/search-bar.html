<form role="search" class="mx-auto flex w-full max-w-2xl items-stretch gap-2" (submit)="submit($event)">
  <div class="flex min-w-0 flex-1 items-center gap-3 rounded-xl border border-black/10 bg-gray-50 px-4 transition-colors
           focus-within:border-black/25 focus-within:bg-white">
    <svg class="h-4 w-4 shrink-0 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </svg>

    <input type="search" name="q" autocomplete="off" spellcheck="false" [value]="text()"
      (input)="text.set($any($event.target).value)"
      placeholder="Describe lo que buscas con términos visuales"
      class="min-w-0 flex-1 bg-transparent py-3 text-base text-gray-900 outline-none placeholder:text-gray-400" />
  </div>

  <button type="submit" [disabled]="!text().trim()"
    class="shrink-0 rounded-xl bg-blue-600 px-6 text-sm font-medium text-white transition-colors
           hover:bg-blue-700 active:bg-blue-800
           focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2
           disabled:cursor-not-allowed disabled:opacity-50">
    Buscar
  </button>
</form>
