<div class="relative flex">
  <select
    id="model-select"
    name="model"
    aria-label="Modelo de búsqueda"
    [value]="selected()"
    class="h-full appearance-none rounded-lg text-sm font-normal bg-gray-200 py-3 pl-4 pr-8 text-gray-900 outline-none transition-colors hover:bg-gray-300 focus:border-black/25 focus:bg-gray-300"
    (change)="onModelSelected(selectBox.value)"
    #selectBox
  >
    @for (model of models | keyvalue; track model.key) {
      <option [value]="model.key" [selected]="model.key === selected()">{{ model.value }}</option>
    }
  </select>

  <svg
    class="pointer-events-none absolute right-2.5 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-600"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="m6 9 6 6 6-6" />
  </svg>
</div>
