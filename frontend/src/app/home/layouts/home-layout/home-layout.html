<main class="mx-auto w-full max-w-6xl px-4 py-8">
  <search-bar (search)="onSearch($event)" />

  @if (assetsResource.error()) {
    <p class="mt-8 text-center text-sm text-gray-500">Ocurrió un error al buscar.</p>
  } @else if (assetsResource.hasValue()) {
    <ul class="mt-8 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
      @for (result of assetsResource.value().results; track result.assetId) {
        <li class="aspect-square overflow-hidden rounded-xl border border-black/10 bg-gray-50">
          <img [src]="`http://localhost:8080/api/v1/assets/image/${result.assetId}`" alt="" loading="lazy"
            class="h-full w-full object-cover transition-transform duration-300 hover:scale-105" />
        </li>
      } @empty {
        <li class="col-span-full text-center text-sm text-gray-500">No se encontraron resultados.</li>
      }
    </ul>
  }
</main>
