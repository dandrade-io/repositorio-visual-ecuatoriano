<div class="flex flex-col min-h-dvh bg-[#F8F8FD]">
  <app-header />

  <main class="flex-1 mx-auto min-h-dvh px-12 md:px-36 pt-3 pb-6 ">
    <app-search-bar (search)="onSearch($event)" />

    @if (artworksResource.isLoading()) {
      <p class="mt-8 text-center text-sm text-gray-500">Cargando...</p>
    } @else if (artworksResource.hasValue()) {
      <app-artwork-grid [artworks]="artworksResource.value()" />
    } @else if (artworksResource.error()) {
      <p class="mt-8 text-center text-sm text-gray-500">Ocurrió un error al buscar.</p>
    }
  </main>
</div>
