<main class="mx-auto min-h-screen min-w-screen px-[12vw] py-8 bg-[#F8F8FD]">
  <div class="flex justify-end h-11">
    @if (auth.authenticated()) {
      <app-button (click)="goToRegisterAlbumCoverPage()" color="#3D9970" class="cursor-pointer">
        <div class="flex items-center"><app-square-plus class="mr-1" /> Contribuir</div>
      </app-button>
      <div class="w-4"></div>
      <app-profile-menu />
    } @else {
      <app-button (click)="register()" color="#DBDBDB" class="cursor-pointer"
        >Registrarse</app-button
      >
      <div class="w-3"></div>
      <app-button (click)="login()" color="#155dfc" class="cursor-pointer"
        >Iniciar sesión</app-button
      >
    }
  </div>

  <div class="h-8"></div>

  <search-bar (search)="onSearch($event)" />

  @if (artworksResource.error()) {
    <p class="mt-8 text-center text-sm text-gray-500">Ocurrió un error al buscar.</p>
  } @else if (artworksResource.hasValue()) {
    <app-artwork-grid [artworks]="artworksResource.value()" />
  }
</main>
