<div class="flex flex-col min-h-dvh bg-[#F8F8FD]">
  <app-header />

  <main class="flex-1 min-h-dvh px-12 md:px-36 pt-2 pb-6">
    <app-search-bar
      [query]="this.query() ?? ''"
      [model]="this.validModel() ?? 'jina-clip-v2'"
      (search)="onSearch($event.query, $event.asset ?? null, $event.model)"
    />

    <div class="h-2"></div>

    <router-outlet />
  </main>
</div>
