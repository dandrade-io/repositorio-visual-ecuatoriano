<header
  class="sticky top-0 z-100 flex flex-row justify-between items-center px-12 py-2 bg-[#F8F8FD]/90 backdrop-blur"
>
  <a routerLink="/" aria-label="Inicio"> <app-logo class="block size-14 md:size-22"> </app-logo> </a>

  <div class="flex flex-row items-center">
    @if (auth.authenticated()) {
      <app-button (click)="goToRegisterAlbumCover()" color="#3D9970" class="cursor-pointer h-10">
        <div class="flex items-center"><app-square-plus class="mr-2" /> Contribuir</div>
      </app-button>
      <div class="w-3"></div>
      <app-profile-menu />
    } @else {
      <app-button (click)="register()" color="#E5E7EB" class="cursor-pointer h-10"
        >Registrarse</app-button
      >
      <div class="w-3"></div>
      <app-button (click)="login()" class="cursor-pointer h-10">Iniciar sesión</app-button>
    }
  </div>
</header>
