<button
  type="button"
  [cdkMenuTriggerFor]="profileMenu"
  class="flex h-11 w-11 items-center justify-center overflow-hidden rounded-full border border-[#E7E1D8] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#17362A]/40"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="#626262"
    class="size-6 object-cover"
  >
    <path
      fill-rule="evenodd"
      d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
      clip-rule="evenodd"
    />
  </svg>
</button>

<ng-template #profileMenu>
  <div cdkMenu class="mt-2 min-w-50 rounded-xl border border-[#E7E1D8] bg-white p-2 shadow-lg">
    <div class="px-2 py-2">
      <p class="truncate text-base font-normal text-black">{{ profileInfo().name }}</p>
      <p class="truncate text-sm text-stone-500">&#64;{{ profileInfo().username }}</p>
      @if (profileInfo().role; as role) {
        <p class="mt-3 mb-2">
          <span class="rounded-sm px-2 py-1.5 text-sm font-normal" [class]="role.classes">
            {{ role.label }}
          </span>
        </p>
      }
    </div>
    <hr class="my-1 border-0 border-t border-[#E7E1D8]" />
    <!-- <a
      cdkMenuItem
      routerLink="/profile"
      class="block cursor-pointer rounded-lg px-3 py-2 text-sm hover:bg-stone-100 focus-visible:bg-stone-100 focus-visible:outline-none"
    >
      Mi perfil
    </a>
    <a
      cdkMenuItem
      routerLink="/add/album-cover"
      class="block cursor-pointer rounded-lg px-3 py-2 text-sm hover:bg-stone-100 focus-visible:bg-stone-100 focus-visible:outline-none"
    >
      Subir portada
    </a>
    <hr class="my-1 border-0 border-t border-[#E7E1D8]" /> -->
    <button
      cdkMenuItem
      type="button"
      (click)="logout()"
      class="block w-full cursor-pointer rounded-lg px-3 py-2 text-left text-sm text-red-700 hover:bg-red-50 focus-visible:bg-red-50 focus-visible:outline-none"
    >
      Cerrar sesión
    </button>
  </div>
</ng-template>
