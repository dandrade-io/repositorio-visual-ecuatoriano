<button
  [type]="type()"
  [disabled]="disabled()"
  [style.--btn-color]="safeColor()"
  [style.--btn-text]="textColor()"
  [class]="
    isOutlined()
      ? 'border border-(--btn-color) text-(--btn-color) hover:bg-(--btn-color)/5'
      : 'bg-(--btn-color) text-(--btn-text) hover:bg-[color-mix(in_srgb,var(--btn-color)_85%,black)]'
  "
  class="h-full shrink-0 cursor-[inherit] rounded-xl px-5 text-base font-normal transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-(--btn-color) focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
>
  <ng-content />
</button>
